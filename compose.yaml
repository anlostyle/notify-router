services:
  notify-router:
    image: ${NOTIFY_IMAGE:-ghcr.io/anlostyle/notify-router}:${NOTIFY_VERSION:-0.3.0}
    build: .
    container_name: notify-router
    ports:
      - "${NOTIFY_BIND:-127.0.0.1}:${NOTIFY_PORT:-5401}:5400"
    volumes:
      - ./data:/data
    environment:
      WORKDIR: /data
      NH_USER: ${NH_USER:-admin}
      NH_PASSWORD: ${NH_PASSWORD:?Set NH_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      NOTIFY_API_TOKEN: ${NOTIFY_API_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      ACCESS_LOG: ${ACCESS_LOG:-0}
      INSTALL_PLUGIN_REQUIREMENTS: ${INSTALL_PLUGIN_REQUIREMENTS:-1}
      PLUGIN_TASKS_ENABLED: ${PLUGIN_TASKS_ENABLED:-1}
      TZ: ${TZ:-Asia/Shanghai}
    restart: unless-stopped
